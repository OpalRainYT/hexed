<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexed - Minecraft Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-bottom: 2px solid #00ffaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00ffaa;
            text-shadow: 0 0 10px #00ffaa;
        }

        .status {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #7cff93;
            box-shadow: 0 0 5px #7cff93;
        }

        .status-text {
            font-size: 14px;
            color: #7cff93;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid #00ffaa;
            overflow-y: auto;
            padding: 15px;
        }

        .module-category {
            margin-bottom: 20px;
        }

        .category-title {
            color: #00ffaa;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding: 5px;
            border-left: 3px solid #00ffaa;
            padding-left: 8px;
        }

        .module-item {
            background: rgba(0, 255, 170, 0.1);
            margin: 8px 0;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .module-item:hover {
            background: rgba(0, 255, 170, 0.2);
            transform: translateX(5px);
        }

        .module-item.active {
            background: rgba(0, 255, 170, 0.3);
            border-left: 3px solid #00ffaa;
            padding-left: 7px;
        }

        .toggle-switch {
            width: 30px;
            height: 16px;
            background: #444;
            border-radius: 8px;
            position: relative;
            transition: background 0.2s;
        }

        .toggle-switch.active {
            background: #00ffaa;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
        }

        .toggle-switch.active::after {
            left: 16px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, rgba(26, 26, 46, 0.5), rgba(22, 33, 62, 0.5));
            overflow: hidden;
        }

        .game-viewport {
            flex: 1;
            position: relative;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="%23222" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="%231a1a2e"/><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            border-top: 1px solid rgba(0, 255, 170, 0.2);
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffaa;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffaa;
        }

        .hud-title {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .hud-version {
            font-size: 12px;
            color: #9fe7ff;
            text-shadow: 0 0 5px #9fe7ff;
        }

        .hud-status {
            font-size: 12px;
            color: #7cff93;
            text-shadow: 0 0 5px #7cff93;
            margin-top: 4px;
        }

        .coords {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #9fe7ff;
            font-family: 'Courier New', monospace;
        }

        .fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #00ffaa;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #00ffaa;
        }

        .bottom-bar {
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid #00ffaa;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .keybinds {
            color: #9fe7ff;
        }

        .keybind-item {
            display: inline-block;
            margin-right: 20px;
        }

        .keybind-key {
            background: rgba(0, 255, 170, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            color: #00ffaa;
            font-weight: bold;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 170, 0.4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 170, 0.6);
        }

        .settings-panel {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffaa;
            padding: 20px;
            border-radius: 8px;
            min-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .settings-panel.active {
            display: block;
        }

        .settings-title {
            color: #00ffaa;
            font-size: 18px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ffaa;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-label {
            color: #9fe7ff;
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
        }

        .setting-input {
            width: 100%;
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid #00ffaa;
            color: #00ffaa;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00ffaa;
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⬡ HEXED</div>
        <div class="status">
            <div class="status-indicator"></div>
            <div class="status-text">ONLINE</div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <!-- Combat -->
            <div class="module-category">
                <div class="category-title">Combat</div>
                <div class="module-item" onclick="toggleModule(this, 'aura')">
                    Aura
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'velocity')">
                    Velocity
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item active" onclick="toggleModule(this, 'reach')">
                    Reach
                    <div class="toggle-switch active"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'criticals')">
                    Criticals
                    <div class="toggle-switch"></div>
                </div>
            </div>

            <!-- Movement -->
            <div class="module-category">
                <div class="category-title">Movement</div>
                <div class="module-item" onclick="toggleModule(this, 'speed')">
                    Speed
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'flight')">
                    Flight
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'noclip')">
                    NoClip
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item active" onclick="toggleModule(this, 'climb')">
                    Climb
                    <div class="toggle-switch active"></div>
                </div>
            </div>

            <!-- Render -->
            <div class="module-category">
                <div class="category-title">Render</div>
                <div class="module-item active" onclick="toggleModule(this, 'esp')">
                    ESP
                    <div class="toggle-switch active"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'fullbright')">
                    Fullbright
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'xray')">
                    X-Ray
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'nametags')">
                    NameTags
                    <div class="toggle-switch"></div>
                </div>
            </div>

            <!-- Utility -->
            <div class="module-category">
                <div class="category-title">Utility</div>
                <div class="module-item" onclick="toggleModule(this, 'autobuild')">
                    AutoBuild
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'chat')">
                    Chat
                    <div class="toggle-switch"></div>
                </div>
                <div class="module-item" onclick="toggleModule(this, 'autoeat')">
                    AutoEat
                    <div class="toggle-switch"></div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="game-viewport">
                <div class="hud-overlay">
                    <div class="hud-title">HEXED</div>
                    <div class="hud-version">v0.1.0</div>
                    <div class="hud-status">Status: Online</div>
                </div>

                <div class="fps-counter">
                    <span id="fps">60</span> FPS
                </div>

                <div class="coords">
                    X: <span id="coord-x">0.00</span> Y: <span id="coord-y">64.00</span> Z: <span id="coord-z">0.00</span>
                </div>

                <div class="settings-panel" id="settingsPanel">
                    <button class="close-btn" onclick="closeSettings()">✕</button>
                    <div class="settings-title">Settings</div>
                    
                    <div class="setting-item">
                        <label class="setting-label">Player Name</label>
                        <input type="text" class="setting-input" value="Player" id="playerName">
                    </div>

                    <div class="setting-item">
                        <label class="setting-label">Reach Distance</label>
                        <input type="range" class="setting-input" min="3" max="10" value="5" id="reachDistance">
                    </div>

                    <div class="setting-item">
                        <label class="setting-label">Speed Multiplier</label>
                        <input type="range" class="setting-input" min="1" max="5" value="2" id="speedMult">
                    </div>

                    <div class="setting-item">
                        <label class="setting-label">HUD Color</label>
                        <input type="color" class="setting-input" value="#00ffaa" id="hudColor">
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="keybinds">
                    <span class="keybind-item"><span class="keybind-key">H</span> Toggle HUD</span>
                    <span class="keybind-item"><span class="keybind-key">ESC</span> Menu</span>
                    <span class="keybind-item"><span class="keybind-key">TAB</span> Module List</span>
                </div>
                <div style="cursor: pointer; color: #00ffaa;" onclick="openSettings()">⚙ Settings</div>
            </div>
        </div>
    </div>

    <script>
        let fpsCounter = 60;
        let frameCount = 0;
        let lastTime = performance.now();

        // Simulate FPS counter
        setInterval(() => {
            const now = performance.now();
            const delta = now - lastTime;
            frameCount++;

            if (delta >= 1000) {
                fpsCounter = frameCount;
                document.getElementById('fps').textContent = fpsCounter;
                frameCount = 0;
                lastTime = now;
            }
        }, 16);

        // Simulate player coordinates
        let playerX = 0, playerY = 64, playerZ = 0;

        function updateCoordinates() {
            playerX = (Math.sin(Date.now() / 5000) * 100).toFixed(2);
            playerZ = (Math.cos(Date.now() / 5000) * 100).toFixed(2);
            
            document.getElementById('coord-x').textContent = playerX;
            document.getElementById('coord-y').textContent = playerY.toFixed(2);
            document.getElementById('coord-z').textContent = playerZ;

            requestAnimationFrame(updateCoordinates);
        }

        updateCoordinates();

        // Module toggle functionality
        function toggleModule(element, moduleName) {
            element.classList.toggle('active');
            const toggle = element.querySelector('.toggle-switch');
            toggle.classList.toggle('active');
            
            const status = toggle.classList.contains('active') ? 'enabled' : 'disabled';
            console.log(`${moduleName} ${status}`);
        }

        // Settings panel
        function openSettings() {
            document.getElementById('settingsPanel').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsPanel').classList.remove('active');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSettings();
            }
            if (e.key === 'h' || e.key === 'H') {
                console.log('HUD toggled');
            }
        });

        // Apply HUD color changes
        document.getElementById('hudColor').addEventListener('change', (e) => {
            const color = e.target.value;
            const hex = parseInt(color.substring(1), 16);
            const rgb = `rgb(${(hex >> 16) & 255}, ${(hex >> 8) & 255}, ${hex & 255})`;
            document.documentElement.style.setProperty('--hud-color', rgb);
        });
    </script>
</body>
</html>
