<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexed Launcher</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0d1320, #101826);
      color: #ecfffb;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      width: min(420px, 90vw);
      border: 2px solid #21f0b1;
      border-radius: 18px;
      background: rgba(13, 19, 32, 0.9);
      box-shadow: 0 0 20px rgba(33, 240, 177, 0.22);
      padding: 36px 28px;
      text-align: center;
    }
    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #21f0b1;
      margin-bottom: 10px;
      text-shadow: 0 0 16px rgba(33, 240, 177, 0.6);
    }
    .subtitle {
      font-size: 14px;
      color: #a5d8ff;
      margin-bottom: 24px;
    }
    .launch-btn {
      background: linear-gradient(180deg, #21f0b1, #1bbd94);
      color: #081814;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      cursor: pointer;
      transition: 0.18s ease;
    }
    .launch-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 22px rgba(33, 240, 177, 0.6);
    }
    .status {
      margin-top: 18px;
      font-size: 12px;
      color: #8fe9d0;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="logo">HEXED</div>
    <div class="subtitle">Minecraft 1.20.5 • Chromebook Client</div>
    <button class="launch-btn" onclick="launchClient()">LAUNCH CLIENT</button>
    <div class="status" id="status">Ready</div>
  </div>

  <script>
    function launchClient() {
      const status = document.getElementById('status');
      status.textContent = 'Opening client...';

      const target = 'index.html';
      const finalUrl = new URL(target, window.location.href).toString();

      setTimeout(() => {
        window.location.href = finalUrl;
      }, 250);
    }
  </script>
</body>
</html>
